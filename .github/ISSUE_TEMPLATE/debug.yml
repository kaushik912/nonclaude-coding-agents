name: 🐛 Debug Report
description: Something is broken or behaving unexpectedly. Give enough detail to reproduce and debug it.
title: "[DEBUG] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What went wrong?
      description: One or two sentences.
      placeholder: "e.g. GET /items returns 500 when the list is empty"
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact commands / prompts, in order.
      placeholder: |
        1. cd pi-agent-demo/rest-api
        2. npm install && npm start
        3. curl localhost:3000/items
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behavior
      placeholder: |
        Expected: 200 with []
        Actual: 500 Internal Server Error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace / agent output
      description: Full error text, or the agent transcript if the agent misbehaved. Redact secrets.
      render: shell

  - type: textarea
    id: tried
    attributes:
      label: What have you already tried?
      description: Fixes attempted, hypotheses ruled out, does it happen every time?
