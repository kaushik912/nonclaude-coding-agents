spring.application.name=calendar-backend

# Database (credentials come from env vars; defaults match local .env)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/calendar_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:mysqltest@2026}

# JPA / Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# OpenAPI / Swagger
springdoc.swagger-ui.path=/swagger-ui.html
